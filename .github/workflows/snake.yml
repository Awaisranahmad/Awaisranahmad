name: Generate Blue Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Awaisranahmad
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#0b3d5c,#1a5b8c,#2b7abd,#63b1ff
            dist/github-contribution-grid-snake-dark.svg?palette=#0b3d5c,#1a5b8c,#2b7abd,#63b1ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
