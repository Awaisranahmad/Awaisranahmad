name: Generate Blue Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Awaisranahmad
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#1e88e5,#e8f5e9,#a5d6a7,#66bb6a,#43a047,#2e7d32
            dist/github-contribution-grid-snake-dark.svg?palette=#1e88e5,#e8f5e9,#a5d6a7,#66bb6a,#43a047,#2e7d32

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
